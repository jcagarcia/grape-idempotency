# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly run to catch new Ruby / Grape releases
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Grape ${{ matrix.grape }}
    # ubuntu-22.04 is the newest runner with prebuilt Ruby 2.6 binaries
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        grape: ['1.5', '1.6', '1.7', '1.8', '2.0', '2.1', '2.2', '2.3', '2.4', '3.0', '3.1', '3.2', '3.3', '4.0']
        # Combinations excluded by each Grape line's required_ruby_version
        exclude:
          # Grape 2.1 - 2.4 require Ruby >= 2.7
          - { ruby: '2.6', grape: '2.1' }
          - { ruby: '2.6', grape: '2.2' }
          - { ruby: '2.6', grape: '2.3' }
          - { ruby: '2.6', grape: '2.4' }
          # Grape 3.0 requires Ruby >= 3.0
          - { ruby: '2.6', grape: '3.0' }
          - { ruby: '2.7', grape: '3.0' }
          # Grape 3.1 requires Ruby >= 3.1
          - { ruby: '2.6', grape: '3.1' }
          - { ruby: '2.7', grape: '3.1' }
          - { ruby: '3.0', grape: '3.1' }
          # Grape 3.2 requires Ruby >= 3.2
          - { ruby: '2.6', grape: '3.2' }
          - { ruby: '2.7', grape: '3.2' }
          - { ruby: '3.0', grape: '3.2' }
          - { ruby: '3.1', grape: '3.2' }
          # Grape 3.3 requires Ruby >= 3.3
          - { ruby: '2.6', grape: '3.3' }
          - { ruby: '2.7', grape: '3.3' }
          - { ruby: '3.0', grape: '3.3' }
          - { ruby: '3.1', grape: '3.3' }
          - { ruby: '3.2', grape: '3.3' }
          # Grape 4.0 requires Ruby >= 3.3
          - { ruby: '2.6', grape: '4.0' }
          - { ruby: '2.7', grape: '4.0' }
          - { ruby: '3.0', grape: '4.0' }
          - { ruby: '3.1', grape: '4.0' }
          - { ruby: '3.2', grape: '4.0' }
        include:
          # Latest Grape release (no pin) on the newest Ruby
          - { ruby: '4.0', grape: 'latest' }
    env:
      GRAPE_VERSION: ${{ matrix.grape == 'latest' && '>= 1' || format('~> {0}.0', matrix.grape) }}

    steps:
    - uses: actions/checkout@v4
    - name: Resolve dependencies for the selected Grape version
      run: rm -f Gemfile.lock
    - name: Set up Ruby
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
    # uses: ruby/setup-ruby@v1
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rspec
