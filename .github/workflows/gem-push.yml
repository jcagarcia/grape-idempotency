name: Ruby Gem

on: workflow_dispatch

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby 3.2
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
    # uses: ruby/setup-ruby@v1
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: 3.2.2

    - name: Get Gem Version
      id: get-version
      run: |
        VERSION=$(ruby -r './lib/grape/idempotency/version.rb' -e "puts Grape::Idempotency::VERSION")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Publish to RubyGems
      run: |
        VERSION=${{ steps.get-version.outputs.version }}
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://rubygems.org/api/v2/rubygems/grape-idempotency/versions/${VERSION}.json")
        if [ "$STATUS" = "200" ]; then
          echo "Gem version ${VERSION} already exists on RubyGems. Skipping the push to RubyGems."
          exit 0
        fi
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        gem build *.gemspec
        gem push *.gem
      shell: bash
      env:
        GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_AUTH_TOKEN}}"
